[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-ng"
version = "1.0.4"
description = "Terminal status monitor for Tor (nyx-ng fork with PyQt6 GUI)."
license = {text = "GPLv3"}
authors = [{name = "H.Ommen", email = "hero67097@gmail.com"}]
keywords = ["tor", "onion", "controller"]
requires-python = ">=3.8"
dependencies = ["stem>=1.7.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Hero9774/nyx_NG"
Repository = "https://github.com/Hero9774/nyx_NG"
Issues = "https://github.com/Hero9774/nyx_NG/issues"

[project.scripts]
nyx-ng = "nyx_ng:main"

[tool.setuptools.packages.find]
include = ["nyx_ng*"]

[tool.setuptools.package-data]
nyx_ng = ["settings/*", "flags/*.svg", "locale/*.json"]
